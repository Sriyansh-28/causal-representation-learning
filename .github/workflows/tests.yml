name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        # IHDP tests skip automatically if the download is unavailable, so the
        # suite does not depend on network access to a third-party host.
        run: pytest -q

      - name: Verify every shipped config is runnable end to end
        run: |
          python experiments/run_experiment.py \
            --config configs/baseline_synthetic.yaml \
            --seeds 2 --no-figures --quiet --output-dir /tmp/ci-results
